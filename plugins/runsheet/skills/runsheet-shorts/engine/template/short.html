<!doctype html>
<!--
  One Short, drawn as a function of time. render.mjs calls load(timeline) once and seek(t) for every
  frame, then takes a picture. Nothing animates by itself: no CSS transitions, no timers, so frame 412
  is the same picture every time it is rendered.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Instrument Sans"; src: url("../fonts/InstrumentSans.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .bgmedia { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #shade { position: absolute; inset: 0; }
  .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(140px); opacity: .32; }
  #pill { position: absolute; top: 236px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px;
    padding: 16px 30px 16px 24px; border-radius: 999px; font-size: 34px; font-weight: 600; letter-spacing: .01em;
    background: var(--pill); border: 2px solid var(--line); white-space: nowrap; }
  #pill i { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); display: block; }
  .card { position: absolute; left: 110px; right: 110px; top: 420px; height: 520px; border-radius: 34px; overflow: hidden;
    border: 2px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,.35); background: var(--pill); }
  .card img { width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .block { position: absolute; left: 90px; right: 130px; text-align: center; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .w { display: inline-block; white-space: pre; transform-origin: 50% 80%; }
  .w.em { color: var(--accent); }
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; text-align: center; }
  #end .name { font-size: 112px; font-weight: 700; letter-spacing: -0.03em; }
  #end .sub { font-size: 46px; font-weight: 500; color: var(--muted); max-width: 820px; line-height: 1.25; }
  #end .bar { width: 160px; height: 10px; border-radius: 6px; background: var(--accent); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(() => {
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const outCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const outBack = (x) => { x = clamp(x); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  let T = null, stage, words = [], blocks = [], cards = [], end, blobs = [], bgVideo = null;

  const el = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; (parent || stage).appendChild(e); return e; };

  window.load = async (timeline) => {
    T = timeline;
    stage = document.getElementById("stage");
    const r = document.documentElement.style;
    for (const [k, v] of Object.entries(T.theme)) r.setProperty("--" + k, v);

    if (T.background && T.background.type === "image") { const img = el("img", "bgmedia"); img.src = T.background.src; await img.decode().catch(() => {}); }
    if (T.background && T.background.type === "video") {
      bgVideo = el("video", "bgmedia"); bgVideo.src = T.background.src; bgVideo.muted = true; bgVideo.preload = "auto";
      await new Promise((ok) => { bgVideo.onloadeddata = ok; bgVideo.onerror = ok; });
    }
    const shade = el("div"); shade.id = "shade";
    shade.style.background = T.background && T.background.type !== "plain"
      ? "linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.35) 40%, rgba(0,0,0,.7) 100%)" : "transparent";
    if (!T.background || T.background.type === "plain") {
      for (let i = 0; i < 2; i++) { const b = el("div", "blob"); b.style.background = i ? T.theme.accent2 : T.theme.accent; blobs.push(b); }
    }

    const pill = el("div"); pill.id = "pill"; el("i", "", pill); pill.appendChild(document.createTextNode(T.brand.name));

    for (const line of T.lines) {
      if (line.image) { const c = el("div", "card"); const img = el("img", "", c); img.src = line.image; await img.decode().catch(() => {}); cards.push({ c, img, line }); }
      const b = el("div", "block");
      b.style.fontSize = (line.size || (line.hook ? 104 : 86)) + "px";
      const ws = [];
      line.words.forEach((w, i) => {
        const s = el("span", "w" + (w.emph ? " em" : ""), b);
        s.textContent = w.text + (i < line.words.length - 1 ? " " : "");
        ws.push({ s, w });
      });
      blocks.push({ b, line, ws });
      words.push(...ws);
    }

    end = el("div"); end.id = "end";
    el("div", "bar", end);
    el("div", "name", end).textContent = T.end.title;
    if (T.end.sub) el("div", "sub", end).textContent = T.end.sub;

    await document.fonts.ready;
    // Lay each block out once, centred on the caption band (or under the card when the line has a picture).
    for (const bl of blocks) {
      const h = bl.b.getBoundingClientRect().height;
      const mid = bl.line.image ? 1210 : 900;
      bl.b.style.top = Math.round(mid - h / 2) + "px";
    }
    window.ready = true;
  };

  // A line leaves before the next one (or the end card) arrives, so two lines are never on screen at once.
  const EXIT = 0.18;
  const leaveAt = (nextStart) => nextStart - 0.2;

  window.seek = async (t) => {
    // the soft colour behind everything drifts on a slow sine, so a still frame never looks frozen
    blobs.forEach((b, i) => {
      const a = t * 0.18 + i * 2.4;
      b.style.left = (90 + Math.sin(a) * 220 + i * 120) + "px";
      b.style.top = (380 + Math.cos(a * 0.8) * 260 + i * 620) + "px";
    });
    if (bgVideo && bgVideo.duration) {
      const want = t % bgVideo.duration;
      if (Math.abs(bgVideo.currentTime - want) > 0.01) {
        await new Promise((ok) => { bgVideo.onseeked = ok; bgVideo.currentTime = want; setTimeout(ok, 1500); });
      }
    }
    for (const bl of blocks) {
      const { line } = bl;
      const next = blocks[blocks.indexOf(bl) + 1];
      const leaving = clamp((t - leaveAt(next ? next.line.start : T.end.start)) / EXIT);
      const visible = t >= line.start - 0.05 && leaving < 1;
      bl.b.style.display = visible ? "block" : "none";
      if (!visible) continue;
      bl.b.style.opacity = String(1 - leaving);
      bl.b.style.transform = `translateY(${-70 * outCubic(leaving)}px)`;
      for (const { s, w } of bl.ws) {
        const p = clamp((t - w.t0 + 0.06) / 0.16);
        s.style.opacity = String(p);
        s.style.transform = `translateY(${(1 - outCubic(p)) * 26}px) scale(${0.86 + 0.14 * outBack(p)})`;
        const speaking = t >= w.t0 && t < w.t1 + 0.06;
        s.style.color = w.emph || speaking ? "var(--accent)" : "var(--fg)";
      }
    }
    for (const { c, img, line } of cards) {
      const next = blocks.find((b) => b.line.start > line.start);
      const outAt = next ? next.line.start : T.end.start;
      const inP = clamp((t - line.start + 0.1) / 0.3), outP = clamp((t - leaveAt(outAt)) / EXIT);
      c.style.display = inP > 0 && outP < 1 ? "block" : "none";
      c.style.opacity = String(inP * (1 - outP));
      c.style.transform = `translateY(${(1 - outCubic(inP)) * 40}px) scale(${0.96 + 0.04 * outCubic(inP)})`;
      img.style.transform = `scale(${1 + 0.06 * clamp((t - line.start) / Math.max(0.5, outAt - line.start))})`;
    }
    const e = clamp((t - T.end.start) / 0.35); // the last line has gone by now (leaveAt), so the two never overlap
    end.style.display = e > 0 ? "flex" : "none";
    end.style.opacity = String(e);
    end.style.transform = `scale(${0.94 + 0.06 * outBack(e)})`;
    document.getElementById("pill").style.opacity = String(1 - e);
  };
})();
</script>
</body>
</html>
