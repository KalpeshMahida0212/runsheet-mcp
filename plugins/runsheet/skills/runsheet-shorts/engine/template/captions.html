<!doctype html>
<!--
  The captions over a clip cut from a long video, drawn as a function of time on a transparent page: clip.mjs calls
  load(timeline) once and seek(t) for every frame, and lays each picture over the video. A few words at a time, each
  popping in as it is said and lit while it is said, and an optional headline at the top for the whole clip.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Instrument Sans"; src: url("../fonts/InstrumentSans.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .cap { position: absolute; left: 80px; right: 140px; text-align: center; font-weight: 700; font-size: 82px; line-height: 1.1; letter-spacing: -0.01em; }
  .w { display: inline-block; white-space: pre; transform-origin: 50% 80%;
    text-shadow: 4px 0 0 #000, -4px 0 0 #000, 0 4px 0 #000, 0 -4px 0 #000, 3px 3px 0 #000, -3px 3px 0 #000, 3px -3px 0 #000, -3px -3px 0 #000, 0 10px 28px rgba(0,0,0,.55); }
  #head { position: absolute; left: 80px; right: 80px; top: 300px; display: flex; justify-content: center; }
  #head div { max-width: 860px; padding: 22px 36px; border-radius: 28px; background: rgba(12,12,16,.8); border: 2px solid rgba(255,255,255,.14);
    font-size: 60px; font-weight: 700; line-height: 1.12; letter-spacing: -0.015em; text-align: center; }
  #head b { color: var(--accent); }
</style>
</head>
<body>
<script>
(() => {
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const outCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const outBack = (x) => { x = clamp(x); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  let T = null, groups = [], head = null;

  window.load = async (timeline) => {
    T = timeline;
    document.documentElement.style.setProperty("--accent", T.accent);
    if (T.headline) {
      head = document.createElement("div"); head.id = "head";
      const box = document.createElement("div");
      // *words* in the headline are drawn in the accent colour
      T.headline.split(/(\*[^*]+\*)/).filter(Boolean).forEach((part) => {
        const e = document.createElement(part.startsWith("*") ? "b" : "span");
        e.textContent = part.replace(/\*/g, "");
        box.appendChild(e);
      });
      head.appendChild(box); document.body.appendChild(head);
    }
    for (const g of T.groups) {
      const b = document.createElement("div"); b.className = "cap";
      const ws = g.words.map((w, i) => {
        const s = document.createElement("span"); s.className = "w";
        s.textContent = w.text + (i < g.words.length - 1 ? " " : "");
        b.appendChild(s);
        return { s, w };
      });
      document.body.appendChild(b);
      groups.push({ b, g, ws });
    }
    await document.fonts.ready;
    for (const { b } of groups) b.style.top = Math.round(T.captionY - b.getBoundingClientRect().height / 2) + "px";
    window.rows = groups.map(({ b }) => Math.round(b.getBoundingClientRect().height / (82 * 1.1)));
    window.ready = true;
  };

  window.seek = async (t) => {
    if (head) {
      const p = clamp((t - 0.05) / 0.3);
      head.style.opacity = String(p);
      head.style.transform = `translateY(${(1 - outCubic(p)) * -24}px) scale(${0.94 + 0.06 * outBack(p)})`;
    }
    // one group at a time: it appears as its first word is said and gives way the moment the next one starts
    for (const { b, g, ws } of groups) {
      const on = t >= g.start - 0.04 && t < g.until;
      b.style.display = on ? "block" : "none";
      if (!on) continue;
      for (const { s, w } of ws) {
        const p = clamp((t - w.t0 + 0.06) / 0.14);
        s.style.opacity = String(p);
        s.style.transform = `translateY(${(1 - outCubic(p)) * 18}px) scale(${0.9 + 0.1 * outBack(p)})`;
        s.style.color = w.emph || (t >= w.t0 && t < w.t1 + 0.04) ? T.accent : "#ffffff";
      }
    }
  };
})();
</script>
</body>
</html>
